# ============================================================================
# 聊天流转插件配置文件
# ============================================================================
# 位置: plugins/1m.watchyourstream/config.toml
# 编辑后自动热重载
# ============================================================================

# ----------------------------------------------------------------------------
# 基础设置
# ----------------------------------------------------------------------------
[basic]
enabled = false                     # 插件总开关
config_version = "1.0.0"

# ----------------------------------------------------------------------------
# 聊天流白名单 (只有这些流参与流转)
# ----------------------------------------------------------------------------
[whitelist_streams]
whitelist_streams = []              # 示例: ["stream_123", "stream_456"]

# ----------------------------------------------------------------------------
# 用户白名单 (这些用户的消息不会触发流转)
# ----------------------------------------------------------------------------
[user_whitelist]
user_whitelist_enabled = false
whitelist_users = []                # 示例: ["user_789"]

# ----------------------------------------------------------------------------
# 关键词过滤 (包含关键词的消息不触发)
# ----------------------------------------------------------------------------
[keyword_filter]
keyword_filter_enabled = false
filtered_keywords = []              # 示例: ["广告", "测试"]

# ----------------------------------------------------------------------------
# 历史消息与LLM设置
# ----------------------------------------------------------------------------
[llm_settings]
enabled = true                      # 启用LLM生成回复
history_limit = 20                  # 获取最近多少条消息作为上下文
include_forwarded_messages = false  # 是否包含已被流转的消息（按消息类型过滤）
llm_prompt = '''
基于以下对话历史（每个消息格式为"[用户]: 内容"）以及当前消息，生成一句自然的接话，使话题在不同群聊或私聊之间流畅流转。
要求：
1. 回复应保持与对话历史一致的语气和话题。
2. 不要重复历史中的原话，不要提及“根据历史”等元信息。
3. 保持简洁自然，不超过50字。
4. 如果历史内容不足以支持接话，可回复“（继续）”。

对话历史：
{history}

当前消息（来自 {source_user}）：{current_message}

请直接输出接话内容：
'''

# ----------------------------------------------------------------------------
# 触发条件
# ----------------------------------------------------------------------------
[trigger]
require_same_user_recent = true     # 是否要求目标流中最近有相同用户发言
same_user_recent_limit = 10         # 检查最近多少条消息中存在相同用户
same_user_recent_time_window = 300  # 时间窗口（秒），0表示不限
action_cooldown_seconds = 60        # 每个流的动作冷却时间（防止频繁触发）

# ----------------------------------------------------------------------------
# 回复消息设置
# ----------------------------------------------------------------------------
[reply]
forward_reply = true                # 是否转发回复类型的消息（作为上下文的一部分）