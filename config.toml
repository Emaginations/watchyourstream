# ============================================================================
# 聊天流转插件配置文件
# ============================================================================
# 配置文件位置: plugins/1m.watchyourstream/config.toml
# 编辑后插件会自动热重载，无需重启
# ============================================================================

# ----------------------------------------------------------------------------
# 基础设置
# ----------------------------------------------------------------------------
[basic]
# 插件开关: true(启用) / false(禁用)
enabled = false

# 配置版本 (请勿修改)
config_version = "1.0.0"

# ----------------------------------------------------------------------------
# 聊天流列表
# ----------------------------------------------------------------------------
[stream_list]
# 允许流转的聊天流ID列表
# 消息只会在这些聊天流中流转，支持群聊和私聊
# 示例: ["stream_123", "stream_456", "group_789"]
allowed_streams = []

# ----------------------------------------------------------------------------
# 白名单设置
# ----------------------------------------------------------------------------
[whitelist]
# 白名单开关: true(启用) / false(禁用)
# 启用后，白名单中的用户消息不会被转发
whitelist_enabled = false

# 白名单用户ID列表
# 示例: ["user_123", "user_456", "qq_10001"]
whitelist_users = []

# ----------------------------------------------------------------------------
# 黑名单设置
# ----------------------------------------------------------------------------
[blacklist]
# 黑名单开关: true(启用) / false(禁用)
# 启用后，黑名单中的用户消息不会被转发
blacklist_enabled = false

# 黑名单用户ID列表
# 示例: ["user_789", "user_012", "qq_10002"]
blacklist_users = []

# ----------------------------------------------------------------------------
# 关键词过滤设置
# ----------------------------------------------------------------------------
[keyword_filter]
# 关键词过滤开关: true(启用) / false(禁用)
# 启用后，包含指定关键词的消息不会被转发
keyword_filter_enabled = false

# 过滤关键词列表
# 包含这些关键词的消息不会被转发
# 示例: ["广告", "测试", "ignore"]
filtered_keywords = []

# ----------------------------------------------------------------------------
# 回复消息设置
# ----------------------------------------------------------------------------
[reply]
# 是否转发回复消息: true(转发) / false(不转发)
# 关闭后，回复类型的消息不会被流转
forward_reply = true